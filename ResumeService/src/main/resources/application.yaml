# CLOUD variant (Jobber-Cloud): this service loads its FULL configuration from AWS AppConfig at
# startup — see AppConfigEnvironmentPostProcessor, which fetches the AppConfig 'resume' document via
# the AppConfig Agent sidecar (localhost:2772). Only the bootstrap identity lives here; datasource,
# OpenAI, pgvector, actuator, etc. are all defined in AppConfig, with secrets as ${ENV} placeholders
# resolved against the Parameter-Store-injected environment variables.
#
# AppConfig coordinates come from the environment (APPCONFIG_PROFILE=resume, and APPCONFIG_APPLICATION
# / APPCONFIG_ENVIRONMENT which default to jobber / prod). With APPCONFIG_PROFILE unset (local dev)
# the post-processor is a no-op and this file is the whole config.
spring:
  application:
    name: ResumeService
