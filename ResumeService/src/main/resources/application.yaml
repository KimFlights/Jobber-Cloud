spring:
  application:
    name: ResumeService

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        prefer-ip-address: true
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}-${random.value}

  datasource:
    url: ${RESUME_DB_URL:jdbc:postgresql://localhost:5432/resume}
    username: ${RESUME_DB_USER:jobber}
    password: ${RESUME_DB_PASSWORD:jobber}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        options:
          # Pinned model + dimension. MUST match JobCompressionService or cosine match is meaningless.
          model: ${EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${EMBEDDING_DIM:1536}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${EMBEDDING_DIM:1536}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
