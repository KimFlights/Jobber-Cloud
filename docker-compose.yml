# Full Jobber stack: backing infrastructure + all five Spring Boot services (ARCHITECTURE.md §2).
# `docker compose up --build` builds and runs everything; the UI (Jobber-UI) is run separately.
#
# Infra mirrors the eventual AWS target (Consul, Kafka, Mongo, Postgres+pgvector, Elasticsearch).
# Consul runs in -dev mode for local discovery; services register on startup and the Gateway
# load-balances to them. App services wait for infra healthchecks before starting.
#
# OpenAI-backed services (ResumeService embeddings, JobCompressionService enrichment) read
# OPENAI_API_KEY from the environment / a local .env file — see .env.example.
services:
  # ---------------------------------------------------------------- infrastructure
  consul:
    image: hashicorp/consul:1.20
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jobber
      POSTGRES_PASSWORD: jobber
      POSTGRES_DB: jobber
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobber"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    # Major version must match the Elasticsearch Java client shipped by Spring Boot 4.1 (9.x).
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Two broker listeners: INTERNAL (kafka:29092) for other containers on this network, and
      # EXTERNAL (localhost:9092) for tools/services running on the host. A single localhost
      # listener would break in-network clients, which resolve `kafka` but get redirected to
      # the advertised host:port.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------- application services
  gateway:
    build: ./Gateway
    ports:
      - "8080:8080"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      consul:
        condition: service_healthy

  resume-service:
    build: ./ResumeService
    ports:
      - "8081:8081"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      RESUME_DB_URL: jdbc:postgresql://postgres:5432/resume
      RESUME_DB_USER: jobber
      RESUME_DB_PASSWORD: jobber
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy

  scraper-service:
    build: ./ScraperService
    ports:
      - "8082:8082"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      consul:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  job-compression-service:
    build: ./JobCompressionService
    ports:
      - "8083:8083"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      KAFKA_BOOTSTRAP: kafka:29092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
    depends_on:
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy

  search-service:
    build: ./SearchService
    ports:
      - "8084:8084"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      KAFKA_BOOTSTRAP: kafka:29092
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      SEARCH_DB_URL: jdbc:postgresql://postgres:5432/search
      SEARCH_DB_USER: jobber
      SEARCH_DB_PASSWORD: jobber
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  pgdata:
  mongodata:
  esdata:
