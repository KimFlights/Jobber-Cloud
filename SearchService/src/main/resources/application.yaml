spring:
  application:
    name: SearchService

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        prefer-ip-address: true
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}-${random.value}

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  datasource:
    url: ${SEARCH_DB_URL:jdbc:postgresql://localhost:5432/search}
    username: ${SEARCH_DB_USER:jobber}
    password: ${SEARCH_DB_PASSWORD:jobber}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP:search}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: cs590.SearchService.event.EnrichedJob
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# ResumeService location for the match-time embedding fetch.
# Default: resolve via Consul + client-side LoadBalancer. Set load-balanced=false and a direct
# url (e.g. http://localhost:8081) to run SearchService without Consul.
resume:
  client:
    load-balanced: ${RESUME_CLIENT_LB:true}
  service:
    url: ${RESUME_SERVICE_URL:lb://ResumeService}

# Search-side freshness rule that triggers background scrapes
search:
  freshness:
    min-results: 10
    max-age-days: 7

resilience4j:
  circuitbreaker:
    instances:
      resumeEmbedding:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
