# CLOUD variant (Jobber-Cloud): full configuration is loaded from AWS AppConfig at startup
# (see AppConfigEnvironmentPostProcessor -> AppConfig 'scraper' profile via the sidecar on localhost:2772).
# Secrets are ${ENV} placeholders in the AppConfig document, resolved against Parameter-Store-injected
# environment variables. With APPCONFIG_PROFILE unset (local dev) the post-processor is a no-op.
spring:
  application:
    name: ScraperService
