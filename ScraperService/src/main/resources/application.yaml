spring:
  application:
    name: ScraperService

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        prefer-ip-address: true
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}-${random.value}

  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:scraper}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP:scraper}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: cs590.ScraperService.event.ScrapeRequest
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# Scraper behaviour
scraper:
  # HTTP settings shared by all jsoup-based site scrapers
  http:
    user-agent: ${SCRAPER_USER_AGENT:JobberBot/1.0 (+https://example.com/bot)}
    timeout-millis: 8000
  # Demo generator — on by default so the pipeline runs without hitting live sites
  sample:
    enabled: ${SCRAPER_SAMPLE_ENABLED:true}
    jobs-per-query: 12
  # Real sites: one flag per SiteScraper bean. Add a bean + a flag here to onboard a site.
  linkedin:
    enabled: ${SCRAPER_LINKEDIN_ENABLED:false}
  freshness:
    min-results: 10
    max-age-days: 7

resilience4j:
  circuitbreaker:
    instances:
      siteScrape:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
