spring:
  application:
    name: ScraperService

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        prefer-ip-address: true
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}-${random.value}

  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:scraper}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP:scraper}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: cs590.ScraperService.event.ScrapeRequest
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# Scraper behaviour
scraper:
  # HTTP settings shared by all site scrapers (jsoup + JSON-API)
  http:
    user-agent: ${SCRAPER_USER_AGENT:JobberBot/1.0 (+https://example.com/bot)}
    timeout-millis: 8000
  # Cap on postings kept per source per scrape — bounds Kafka/Mongo/LLM-enrichment load.
  max-results-per-site: ${SCRAPER_MAX_PER_SITE:15}

  # --- Real JSON-API sources (key-less public APIs / ATS feeds; on by default) ---
  # Global keyword search / feeds:
  remotive:
    enabled: ${SCRAPER_REMOTIVE_ENABLED:true}    # remote-jobs API, server-side search
  arbeitnow:
    enabled: ${SCRAPER_ARBEITNOW_ENABLED:true}   # public JSON feed, filtered locally
  himalayas:
    enabled: ${SCRAPER_HIMALAYAS_ENABLED:true}   # remote-jobs open API, filtered locally
  hackernews:
    enabled: ${SCRAPER_HN_ENABLED:true}          # HN "Who is hiring?" via Firebase API
  # Per-company ATS boards (need company slugs; disable by clearing the list):
  ashby:
    enabled: ${SCRAPER_ASHBY_ENABLED:true}
    companies: ${SCRAPER_ASHBY_COMPANIES:ramp}
  smartrecruiters:
    enabled: ${SCRAPER_SR_ENABLED:true}
    companies: ${SCRAPER_SR_COMPANIES:BoschGroup}
  # Off by default — no live public board verified at build time; supply your own handles.
  lever:
    enabled: ${SCRAPER_LEVER_ENABLED:false}
    companies: ${SCRAPER_LEVER_COMPANIES:}

  # --- HTML scraping (ToS-sensitive; off by default) ---
  linkedin:
    enabled: ${SCRAPER_LINKEDIN_ENABLED:false}

  # --- Demo generator (fake example.com data) — off now that real sources exist ---
  sample:
    enabled: ${SCRAPER_SAMPLE_ENABLED:false}
    jobs-per-query: 12

  freshness:
    min-results: 10
    max-age-days: 7

resilience4j:
  circuitbreaker:
    instances:
      siteScrape:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
